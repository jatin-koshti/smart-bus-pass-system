{% extends "base.html" %}
{% block title %}Register - Smart Bus Pass System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-custom p-4">
                <div class="text-center mb-4">
                    <div class="bg-primary text-white d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 60px; height: 60px;">
                        <i class="bi bi-person-plus fs-3"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Create Account</h3>
                    <p class="text-muted small">Register to book bus tickets and purchase digital passes</p>
                </div>
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label font-medium"><i class="bi bi-person me-1"></i> Full Name</label>
                        <input type="text" name="full_name" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label font-medium"><i class="bi bi-envelope me-1"></i> Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label font-medium"><i class="bi bi-telephone me-1"></i> Phone Number</label>
                            <input type="tel" name="phone" class="form-control" placeholder="+1 234 567 8900">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label font-medium"><i class="bi bi-lock me-1"></i> Password</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label font-medium"><i class="bi bi-shield-check me-1"></i> Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">Create Account</button>
                </form>
                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted small mb-0">Already registered? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold">Log in here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
